name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, so a newly published advisory is noticed even with no commits that week.
    - cron: "17 6 * * 1"

# A new push to the same branch makes the in flight run pointless, so cancel it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features

  docs:
    name: Docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps --workspace --all-features

  audit:
    name: Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # Blocking on purpose. This repository's entire value is a security claim, so a dependency
      # with a known vulnerability should stop a merge rather than produce a notice nobody reads.
      # If a new advisory ever lands with no fixed version available, silence that one advisory by
      # id in audit.toml with a comment explaining why, rather than making this job advisory only.
      - run: cargo audit

  # Jobs to add as the code lands. Listed here so the intent is recorded, and deliberately not
  # enabled yet: a job that lints files which do not exist would fail on every pull request.
  #
  #   server-lint      eslint and prettier over server/, once the relay exists
  #   server-test      node:test on Node 24 and Node 26
  #   typecheck        tsc --noEmit for the relay sources
  #   shellcheck       setup.sh, once it exists
  #   psscriptanalyzer setup.ps1, once it exists
  #   vectors          testdata/vectors.json known answer tests plus the libsodium interop check,
  #                    which proves the "libsodium compatible" claim rather than assuming it
  #   integration      start the relay, connect two headless clients, assert a round trip and
  #                    assert the sender does not receive its own message
  #   build            tray hello world build matrix for Windows, macOS and Linux
