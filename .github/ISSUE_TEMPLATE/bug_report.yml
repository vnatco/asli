name: Bug report
description: Something does not work, or works differently than documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Before you type anything, two warnings.**

        1. Never paste your join token (the string starting with `asli1_`) or a photo of your QR
           code into an issue. That string is the key to your clipboard. Anyone who has it can read
           everything you copy. If you have already shared it somewhere, open the app, choose Reset
           account, and set your devices up again.
        2. Never paste clipboard content. Describe it instead: the kind of content and its rough
           size, for example "about 200 characters of plain text" or "a 1.2 MB screenshot".

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you expect, and what happened instead?
      placeholder: I copied text on my laptop and it never appeared on my desktop.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What did you do, in order? Say whether it happens every time or occasionally.
      placeholder: |
        1. Copy a line of text in a terminal on machine A
        2. Wait a few seconds
        3. Paste on machine B
        4. The old clipboard content is pasted instead
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Asli version
      description: From the tray menu, About. If you built from source, the commit hash.
      placeholder: 0.1.0, or commit a1b2c3d
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      description: The machine where the problem appears. File one issue per affected machine if they differ.
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: Operating system version
      description: For Linux, name the distribution too.
      placeholder: Windows 11 24H2, macOS 26.1, Arch Linux (rolling, updated 2026-09-01)
    validations:
      required: true

  - type: dropdown
    id: display-server
    attributes:
      label: Display server (Linux only)
      description: Run `echo $XDG_SESSION_TYPE` if you are not sure. Skip this on Windows and macOS.
      options:
        - Not applicable (Windows or macOS)
        - Wayland
        - X11
        - Unsure
    validations:
      required: true

  - type: input
    id: desktop
    attributes:
      label: Desktop environment or compositor
      description: >
        This is nearly always the detail that matters on Linux, because clipboard access works
        differently on each one. Name it and its version.
      placeholder: Hyprland 0.58, Sway 1.12, KDE Plasma 6.5, GNOME 49, or "not applicable"
    validations:
      required: true

  - type: dropdown
    id: relay
    attributes:
      label: Which relay
      options:
        - The default public relay
        - A relay I host myself
        - Unsure
    validations:
      required: true

  - type: input
    id: content
    attributes:
      label: What was on the clipboard
      description: >
        The kind and rough size only. Do not paste the content itself, and do not paste anything
        that came from a password manager.
      placeholder: About 40 characters of plain text, copied from a browser
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: >
        If the app runs, use the tray menu action "Copy diagnostics" and paste the result here. It
        contains recent log lines and never contains clipboard content. Read it before posting.
      render: text
    validations:
      required: false

  - type: checkboxes
    id: confirmations
    attributes:
      label: Before submitting
      options:
        - label: This issue contains no join token, no QR code image and no clipboard content.
          required: true
        - label: I searched existing issues for this problem.
          required: true
