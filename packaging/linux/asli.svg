<?xml version="1.0" encoding="UTF-8"?>
<!--
  The Asli mark: two offset sheets, which is what a copy looks like.

  This is the same shape the tray draws and the same shape the window's rail draws, but it is a
  third drawing of it, on purpose. The tray icon is per pixel Rust in crates/asli-app/src/tray.rs,
  hand tuned to stay legible at 16 pixels where a scaled down vector turns to mush, and it carries
  a state dot this one must not have. This file is the application icon: it is what the desktop
  shows in a title bar, a task switcher and a launcher, at 48 pixels and up.

  If the mark ever changes, it has to change in both places. There is no shared source, because the
  two jobs genuinely want different drawings.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Asli</title>

  <!-- The back sheet, dimmer, which is what makes it read as behind rather than beside. -->
  <rect x="29.8" y="24" width="138.7" height="161.8" rx="34.7" fill="#3b69bf"/>

  <!-- The front sheet, offset down and right, in the accent the rest of the application uses. -->
  <rect x="87.6" y="70.2" width="138.7" height="161.8" rx="34.7" fill="#4f8cff"/>
</svg>
