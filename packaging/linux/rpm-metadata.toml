# RPM metadata for cargo-generate-rpm, passed with
# --metadata-overwrite rpm-metadata.toml#package.metadata.generate-rpm.
#
# It lives here rather than in crates/asli-app/Cargo.toml so that packaging details stay out of the
# code tree, where they would otherwise sit in the middle of the dependency list.

[package.metadata.generate-rpm]
name = "asli"
summary = "One clipboard, every machine"
# Only a D-Bus session is needed at runtime. There is no GTK, no appindicator and no webview, which
# is the whole reason this package is small and the dependency list is one line.
# Written out rather than worked out, because the automatic scan needs rpm's own tooling and would
# tie building the package to one distribution. The binary is linked against glibc 2.28 and names
# fontconfig and nothing else.
auto-req = "no"
requires = { glibc = ">= 2.28", fontconfig = "*", dbus = "*" }

[[package.metadata.generate-rpm.assets]]
source = "target/release/asli"
dest = "/usr/bin/asli"
mode = "755"

[[package.metadata.generate-rpm.assets]]
source = "LICENSE"
dest = "/usr/share/licenses/asli/LICENSE"
mode = "644"
doc = true

[[package.metadata.generate-rpm.assets]]
source = "README.md"
dest = "/usr/share/doc/asli/README.md"
mode = "644"
doc = true

[[package.metadata.generate-rpm.assets]]
source = "packaging/linux/asli.desktop"
dest = "/usr/share/applications/asli.desktop"
mode = "644"

[[package.metadata.generate-rpm.assets]]
source = "packaging/linux/asli.svg"
dest = "/usr/share/icons/hicolor/scalable/apps/asli.svg"
mode = "644"

[[package.metadata.generate-rpm.assets]]
source = "packaging/icons/asli-256.png"
dest = "/usr/share/icons/hicolor/256x256/apps/asli.png"
mode = "644"

[[package.metadata.generate-rpm.assets]]
source = "packaging/linux/systemd/asli.service"
dest = "/usr/lib/systemd/user/asli.service"
mode = "644"
