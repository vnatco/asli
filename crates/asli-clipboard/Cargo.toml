[package]
name = "asli-clipboard"
description = "Clipboard monitoring and writing for Asli, with one backend per platform"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
asli-core = { path = "../asli-core", version = "0.1.0" }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.14", features = ["xfixes"] }
wayland-client = "0.31"
# Both data control protocols are required, not one. KDE removed wlr-data-control in Plasma 6.4,
# and older wlroots compositors predate ext-data-control, so supporting either alone breaks half
# of the target desktops.
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
# Used only to poll the Wayland connection with a timeout, so that a shutdown
# request is noticed without blocking forever waiting for a clipboard event.
rustix = { version = "1", features = ["event"] }

[target.'cfg(target_os = "windows")'.dependencies]
# The whole Win32 surface this backend needs, behind safe wrappers. The crate sets
# forbid(unsafe_code), and the windows crate is unsafe at every call site, so clipboard-win is
# not a convenience here, it is what makes the lint satisfiable.
# The monitor feature is the message only window plus AddClipboardFormatListener.
clipboard-win = { version = "5.4", features = ["monitor", "std"] }
# Windows puts a device independent bitmap on the clipboard when a source offers no PNG, and PNG
# is the only image format this project carries. Decoding that one case is the only reason this
# dependency exists, so it is scoped to Windows and to two formats rather than pulled in whole.
image = { version = "0.25", default-features = false, features = ["png", "bmp"] }

[target.'cfg(target_os = "macos")'.dependencies]
# NSPasteboard has no change notification, so this backend is a poller, and objc2 is the only
# maintained way to talk to AppKit from Rust. Features are opt in per class in objc2-app-kit, so
# only the handful this backend touches are enabled.
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSString",
    "NSData",
    "NSArray",
    "NSDate",
    "NSProcessInfo",
    "NSObjCRuntime",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSPasteboard",
] }

[dev-dependencies]
