[package]
name = "asli-app"
description = "The Asli daemon and command line interface"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[[bin]]
name = "asli"
path = "src/main.rs"

[dependencies]
asli-clipboard = { path = "../asli-clipboard", version = "0.1.0" }
asli-core = { path = "../asli-core", version = "0.1.0" }
asli-crypto = { path = "../asli-crypto", version = "0.1.0" }
asli-net = { path = "../asli-net", version = "0.1.0" }
clap = { version = "4", features = ["derive"] }
directories = "6"
# The join token is shown as a QR because copying it would put the root secret onto the very
# clipboard this app synchronises. fast_qr is the maintained option; qrcode has had no release
# since 2024.
fast_qr = "0.14"
# Default features give Windows Credential Manager, macOS Keychain and Linux Secret Service over
# pure Rust zbus, which is exactly the set we want and no native libdbus build dependency.
keyring = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "signal", "sync", "time"] }
zeroize = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "time"] }
