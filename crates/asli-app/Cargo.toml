[package]
name = "asli-app"
description = "The Asli daemon and command line interface"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# Not inherited from the workspace, which stays at 1.82 for the library crates. Only this crate
# draws a window, and Slint requires 1.92, so the higher floor is confined to the one crate that
# actually needs it rather than imposed on anyone building the protocol pieces.
rust-version = "1.92"

[lints]
workspace = true

[[bin]]
name = "asli"
path = "src/main.rs"

# The same program without a console, for Windows. See src/asliw.rs.
[[bin]]
name = "asliw"
path = "src/asliw.rs"
required-features = ["windowed"]

[features]
# Builds asliw as well. Only meaningful on Windows.
windowed = []

[dependencies]
asli-clipboard = { path = "../asli-clipboard", version = "0.1.0" }
asli-core = { path = "../asli-core", version = "0.1.0" }
asli-crypto = { path = "../asli-crypto", version = "0.1.0" }
asli-history = { path = "../asli-history", version = "0.1.0" }
asli-net = { path = "../asli-net", version = "0.1.0" }
clap = { version = "4", features = ["derive"] }
directories = "6"
# The join token is shown as a QR because copying it would put the root secret onto the very
# clipboard this app synchronises. fast_qr is the maintained option; qrcode has had no release
# since 2024.
fast_qr = "0.14"
# Default features give Windows Credential Manager, macOS Keychain and Linux Secret Service over
# pure Rust zbus, which is exactly the set we want and no native libdbus build dependency.
keyring = "4"
# Menu definitions. Default features pull gtk3 and libxdo; this project deliberately has no GTK
# anywhere, so they stay off.
muda = { version = "0.20", default-features = false }
# The tray. The ksni feature is a pure Rust StatusNotifierItem implementation, replacing the
# default libappindicator and libxdo backends, which is what keeps GTK out of the dependency tree.
tray-icon = { version = "0.25", default-features = false, features = ["ksni"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The compiled window markup. A crate of its own so this one keeps `forbid(unsafe_code)`: Slint's
# generated code contains an inner `allow(unsafe_code)`, which a `forbid` at the crate root
# overrules. See the documentation on asli-ui.
asli-ui = { path = "../asli-ui", version = "0.1.0" }
# The toolkit's runtime API, for the event loop, images and models. Same feature set as asli-ui,
# so no second copy of the renderer is built: Qt and OpenGL stay off.
slint = { version = "1.18.0", default-features = false, features = [
    "compat-1-18",
    "std",
    "backend-winit",
    "renderer-software",
    # Access to the platform window, used only to raise it when the tray icon is clicked. Slint
    # has no focus call of its own. Adds no crates: winit is already the backend.
    "unstable-winit-030",
] }
tokio = { version = "1", features = ["rt", "macros", "signal", "sync", "time"] }
zeroize = "1"

# Desktop notifications over the session bus on Linux, and toasts on Windows. The default "z"
# feature is pure Rust zbus, which avoids a C libdbus build dependency. Not on macOS: its backend
# there compiles Objective-C against Cocoa through the deprecated NSUserNotification API, so macOS
# notifications go through osascript instead. See src/notify.rs.
[target.'cfg(not(target_os = "macos"))'.dependencies]
notify-rust = "4"

# Only to hide the Dock icon when run without a bundle. Already in the tree through the macOS
# clipboard backend, so this adds features, not crates.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSApplication",
    "NSResponder",
    "NSRunningApplication",
] }

[build-dependencies]
# Compiles the icon into the Windows executables. Does nothing on other targets.
embed-resource = "3"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "time"] }

# The crate is asli-app but the binary and the product are both asli, and the crate name is what
# cargo-deb would otherwise put in dpkg -l.
[package.metadata.deb]
name = "asli"
maintainer-scripts = []
assets = [
    ["target/release/asli", "usr/bin/", "755"],
    ["../../README.md", "usr/share/doc/asli/README.md", "644"],
    ["../../LICENSE", "usr/share/doc/asli/LICENSE", "644"],
]
